apply plugin: 'com.android.application'

// Release signing key for Play Store uploads (an "upload key" -- Play App
// Signing re-signs the app for actual distribution). keystore.properties and
// the .keystore file it points at are both gitignored; this machine's copies
// are the only ones that can produce a release build Play Store will accept
// as an update to this app, so back them up somewhere safe outside git.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.rewardurkids.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rewardurkids.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode: plain integer, bump by 1 on every build submitted to a
        // store or handed out for install (Google Play requires it strictly
        // increasing). versionName: semantic MAJOR.MINOR.PATCH shown to users
        // -- bump MINOR for a build with new features (like this one), PATCH
        // for bugfix-only builds, MAJOR for a first public release / breaking
        // changes. Keep this in sync with frontend/ios/App/App.xcodeproj's
        // CURRENT_PROJECT_VERSION / MARKETING_VERSION.
        versionCode 4
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    lint {
        // AGP runs a "lint vital" pass before release builds that resolves
        // its own separate dependency set -- unrelated to app code quality,
        // and prone to failing on this machine's AVG-intercepted network.
        checkReleaseBuilds false
        abortOnError false
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 code shrinking + obfuscation, off by default in the Capacitor
            // template. Google Play's App Bundle Explorer flags an
            // unobfuscated release as below its optimization threshold.
            // Capacitor's own AARs (capacitor-android, each plugin) ship their
            // own consumer ProGuard rules, so this doesn't need hand-written
            // keep rules for the bridge/plugins to keep working.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Name the built APK after its own version (e.g. app_debug_1.1.0.apk)
    // instead of the generic app-debug.apk, so a handed-off build is
    // self-identifying and the next one won't silently overwrite it.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app_${variant.name}_${variant.versionName}.apk"
        }
        // bundleRelease/bundleDebug don't go through variant.outputs (that's
        // APK-only), so give the AAB the same self-identifying name by
        // renaming it in place once the bundle task finishes -- otherwise
        // it's the generic app-release.aab, indistinguishable from any other
        // version's build and silently overwritten by the next one (the
        // previous app_release_1.1.1.aab only existed because someone
        // renamed it by hand after the fact).
        def bundleTaskName = "bundle${variant.name.capitalize()}"
        tasks.matching { it.name == bundleTaskName }.configureEach { bundleTask ->
            bundleTask.doLast {
                def genericAab = file("$buildDir/outputs/bundle/${variant.name}/app-${variant.name}.aab")
                if (genericAab.exists()) {
                    def versionedAab = new File(genericAab.parentFile, "app_${variant.name}_${variant.versionName}.aab")
                    if (versionedAab.exists()) {
                        versionedAab.delete()
                    }
                    genericAab.renameTo(versionedAab)
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
